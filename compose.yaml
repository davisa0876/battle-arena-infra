services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-battle_arena}
      POSTGRES_USER: ${POSTGRES_USER:-battle_arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-battle_arena_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - battle_arena
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-battle_arena} -d ${POSTGRES_DB:-battle_arena}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - battle_arena
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3 for profile photos. RustFS replaces MinIO CE (Docker Hub images removed).
  minio:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-battlearena}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-battlearena_minio}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - battle_arena
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: amazon/aws-cli:2.22.35
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-battlearena}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-battlearena_minio}
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-battle-arena-profiles}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ENDPOINT=http://minio:9000
        aws --endpoint-url "$$ENDPOINT" s3 mb "s3://$$MINIO_BUCKET" 2>/dev/null || true
        cat > /tmp/bucket-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": "*",
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::$$MINIO_BUCKET/*"]
            }
          ]
        }
        EOF
        aws --endpoint-url "$$ENDPOINT" s3api put-bucket-policy \
          --bucket "$$MINIO_BUCKET" \
          --policy file:///tmp/bucket-policy.json
        echo "S3 bucket ready: $$MINIO_BUCKET"
    networks:
      - battle_arena
    restart: "no"

  api:
    build:
      context: ../battle-arena-api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ../battle-arena-api/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-battle_arena}
      DB_USERNAME: ${POSTGRES_USER:-battle_arena}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-battle_arena_secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      FRONTEND_URL: http://localhost:3000
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-battlearena}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-battlearena_minio}
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
      AWS_BUCKET: ${MINIO_BUCKET:-battle-arena-profiles}
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: http://localhost:${MINIO_API_PORT:-9000}/${MINIO_BUCKET:-battle-arena-profiles}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    volumes:
      - ../battle-arena-api:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - battle_arena
    command: >
      sh -c "composer install --prefer-dist --no-interaction
      && php artisan key:generate --force --no-interaction || true
      && php artisan serve --host=0.0.0.0 --port=8000"

  web:
    build:
      context: ../battle-arena-web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../battle-arena-web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    networks:
      - battle_arena

volumes:
  postgres_data:
  minio_data:
  api_vendor:
  web_node_modules:

networks:
  battle_arena:
    driver: bridge
    name: battle_arena_net
