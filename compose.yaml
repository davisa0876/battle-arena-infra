services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-battle_arena}
      POSTGRES_USER: ${POSTGRES_USER:-battle_arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-battle_arena_secret}
    ports:
      # Localhost only by default. Never tie this to API_BIND_ADDRESS; do not expose the DB to the LAN.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - battle_arena
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-battle_arena} -d ${POSTGRES_DB:-battle_arena}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Localhost only by default. Never tie this to API_BIND_ADDRESS.
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    networks:
      - battle_arena
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3 for future profile photos. RustFS replaces MinIO CE (Docker Hub images removed).
  # Not required for API health/ready or the creature catalog.
  minio:
    image: rustfs/rustfs:1.0.4
    profiles: ["storage"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-battlearena}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-battlearena_minio}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      # Localhost only by default. Independent from API_BIND_ADDRESS.
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - battle_arena
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: amazon/aws-cli:2.22.35
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-battlearena}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-battlearena_minio}
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-battle-arena-profiles}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ENDPOINT=http://minio:9000
        # Create bucket if missing. Do not hide unrelated AWS CLI failures.
        if ! aws --endpoint-url "$$ENDPOINT" s3api head-bucket --bucket "$$MINIO_BUCKET" >/dev/null 2>&1; then
          aws --endpoint-url "$$ENDPOINT" s3 mb "s3://$$MINIO_BUCKET"
        fi
        # Private by default. If a legacy public policy exists, remove it.
        if aws --endpoint-url "$$ENDPOINT" s3api get-bucket-policy --bucket "$$MINIO_BUCKET" >/dev/null 2>&1; then
          aws --endpoint-url "$$ENDPOINT" s3api delete-bucket-policy --bucket "$$MINIO_BUCKET"
          echo "Removed legacy public bucket policy from $$MINIO_BUCKET"
        fi
        echo "S3 bucket ready (private): $$MINIO_BUCKET"
    networks:
      - battle_arena
    restart: "no"

  # Local SMTP catcher for email verification and password reset (Phase 3).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - battle_arena
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../battle-arena-api
      dockerfile: Dockerfile
    ports:
      # Default localhost. Set API_BIND_ADDRESS=0.0.0.0 ONLY for physical mobile device access.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    env_file:
      - ../battle-arena-api/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-battle_arena}
      DB_USERNAME: ${POSTGRES_USER:-battle_arena}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-battle_arena_secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      FRONTEND_URL: http://localhost:3000
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000
      SESSION_DOMAIN: localhost
      SESSION_SAME_SITE: lax
      # Avatar storage: local disk by default (persistent volume). Set profiles when --profile storage is up.
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      PROFILES_DISK: ${PROFILES_DISK:-profiles_local}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-battlearena}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-battlearena_minio}
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
      AWS_BUCKET: ${MINIO_BUCKET:-battle-arena-profiles}
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: http://localhost:${MINIO_API_PORT:-9000}/${MINIO_BUCKET:-battle-arena-profiles}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      # Mailpit for verification / password-reset emails
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_SCHEME: null
      MAIL_FROM_ADDRESS: hello@battlearena.local
      MAIL_FROM_NAME: Battle Arena
      # Phase 5A — WebSocket ticket contract (shared with realtime service)
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:3001/ws}
      WS_TICKET_REDIS_PREFIX: ${WS_TICKET_REDIS_PREFIX:-battle-arena:ws-ticket:}
      WS_TICKET_TTL_SECONDS: ${WS_TICKET_TTL_SECONDS:-30}
    volumes:
      - ../battle-arena-api:/var/www/html
      - api_vendor:/var/www/html/vendor
      # Persistent local avatar fallback when RustFS/S3 is disabled
      - api_profiles:/var/www/html/storage/app/profiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - battle_arena
    entrypoint: ["/bin/sh", "/var/www/html/scripts/docker-entrypoint.sh"]

  web:
    build:
      context: ../battle-arena-web
      dockerfile: Dockerfile
    ports:
      # Default localhost. Optionally set WEB_BIND_ADDRESS=0.0.0.0 to open the web UI on the LAN.
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../battle-arena-web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    networks:
      - battle_arena

  # Phase 5A — authenticated WebSocket transport only (no PvP / battle rooms).
  realtime:
    build:
      context: ../battle-arena-realtime
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3001"
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      REDIS_URL: redis://redis:6379
      WS_TICKET_REDIS_PREFIX: ${WS_TICKET_REDIS_PREFIX:-battle-arena:ws-ticket:}
      WS_TICKET_TTL_SECONDS: ${WS_TICKET_TTL_SECONDS:-30}
      WS_ROOM_GRANT_REDIS_PREFIX: ${WS_ROOM_GRANT_REDIS_PREFIX:-battle-arena:ws-room-grant:}
      REALTIME_NOTIFICATIONS_CHANNEL: ${PVP_REALTIME_CHANNEL:-battle-arena:realtime:notifications:v1}
      WS_MAX_ROOMS_PER_CONNECTION: "5"
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      WS_ALLOW_MISSING_ORIGIN: "true"
      WS_PATH: /ws
      WS_HEARTBEAT_INTERVAL_MS: "30000"
      WS_HEARTBEAT_TIMEOUT_MS: "60000"
      WS_MAX_PAYLOAD_BYTES: "8192"
      WS_MAX_CONNECTIONS: "1000"
      WS_MAX_CONNECTIONS_PER_USER: "5"
      WS_MAX_CONNECTIONS_PER_IP: "20"
      WS_MAX_CONNECTION_LIFETIME_MS: "3600000"
      WS_MAX_BUFFERED_BYTES: "65536"
      SHUTDOWN_TIMEOUT_MS: "10000"
    ports:
      # Default localhost. Set REALTIME_BIND_ADDRESS=0.0.0.0 ONLY for physical phone testing.
      - "${REALTIME_BIND_ADDRESS:-127.0.0.1}:${REALTIME_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - battle_arena

volumes:
  postgres_data:
  minio_data:
  api_vendor:
  api_profiles:
  web_node_modules:

networks:
  battle_arena:
    driver: bridge
    name: battle_arena_net
