# Approximates the CloudFront distribution in front of a private S3 bucket holding the
# React build: compression, immutable caching for hashed assets, no-cache HTML, SPA fallback
# (CloudFront custom error response 403/404 -> /index.html 200) and a response-headers policy.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Vite emits content-hashed file names under /assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Other public/ files (favicons, sounds, PvE art) are not hashed: short TTL.
    location / {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }
}
